<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-panel quality-modal" #modalPanel>
    <div class="modal-header">
      <div>
        <p class="eyebrow">Control de Calidad</p>
        <h2 class="modal-title">Registrar Inspección</h2>
        <p class="subtitle">
          Lote <strong>{{ codigoLote }}</strong>
        </p>
      </div>
      <button class="btn-icon" (click)="onClose()" aria-label="Cerrar">✕</button>
    </div>

    <form class="modal-body" (ngSubmit)="onSubmit()" #form="ngForm">
      <!-- Resultado -->
      <div class="field-group">
        <label class="field-label">Resultado <span class="required">*</span></label>
        <div class="result-selector">
          <button
            *ngFor="let r of results"
            type="button"
            class="result-option"
            [class.selected]="model.resultado === r.value"
            [class.approved]="r.value === 'APROBADO'"
            [class.observed]="r.value === 'OBSERVADO'"
            [class.rejected]="r.value === 'RECHAZADO'"
            (click)="model.resultado = r.value"
          >
            {{ r.icon }} {{ r.label }}
          </button>
        </div>
      </div>

      <!-- Categoria + Calibre -->
      <div class="form-row">
        <div class="field-group">
          <label class="field-label" for="categoria">Categoría de calidad</label>
          <select
            id="categoria"
            class="field-input"
            name="categoriaCalidad"
            [(ngModel)]="model.categoriaCalidad"
            [disabled]="categoriesLoading"
          >
            <option [ngValue]="undefined">Sin categoría</option>
            <option *ngFor="let category of categories" [value]="category.codigo">
              {{ category.nombre }}
            </option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label" for="calibre">Calibre (mm)</label>
          <input
            id="calibre"
            class="field-input"
            type="number"
            name="calibreMm"
            placeholder="0.00"
            [(ngModel)]="model.calibreMm"
            min="0"
            step="0.01"
          />
        </div>
      </div>

      <!-- Pesos -->
      <div class="form-row">
        <div class="field-group">
          <label class="field-label" for="pesoMuestra">Peso muestra (kg)</label>
          <input
            id="pesoMuestra"
            class="field-input"
            type="number"
            name="pesoMuestraKg"
            placeholder="0.00"
            [(ngModel)]="model.pesoMuestraKg"
            min="0"
            step="0.01"
            (ngModelChange)="calcRejection()"
          />
        </div>
        <div class="field-group">
          <label class="field-label" for="pesoRechazado">Peso rechazado (kg)</label>
          <input
            id="pesoRechazado"
            class="field-input"
            type="number"
            name="pesoRechazadoKg"
            placeholder="0.00"
            [(ngModel)]="model.pesoRechazadoKg"
            min="0"
            step="0.01"
            (ngModelChange)="calcRejection()"
          />
        </div>
      </div>

      <!-- Rechazo calculado automáticamente -->
      <div class="rejection-note" *ngIf="rejectionPct !== null">
        <span class="rejection-label">Porcentaje de rechazo calculado:</span>
        <strong [class.high-rejection]="rejectionPct > 15"
          >{{ rejectionPct | number: '1.2-2' }}%</strong
        >
      </div>

      <!-- Observaciones -->
      <div class="field-group">
        <label class="field-label" for="observaciones">Observaciones</label>
        <textarea
          id="observaciones"
          class="field-input field-textarea"
          name="observaciones"
          placeholder="Detalles adicionales de la inspección..."
          [(ngModel)]="model.observaciones"
          rows="3"
        ></textarea>
      </div>

      <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onClose()" [disabled]="saving">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="saving || !model.resultado">
          <span *ngIf="saving" class="spinner"></span>
          {{ saving ? 'Guardando...' : 'Registrar inspección' }}
        </button>
      </div>
    </form>
  </div>
</div>
