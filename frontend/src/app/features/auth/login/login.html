<div class="login-container">
  <div class="glass-panel">
    <div class="logo-container">
      <img src="/logo.png" alt="BananoTrace Logo" class="brand-logo">
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <ng-container *ngIf="!successMessage">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="tu@correo.com"
            (keyup.enter)="onSubmit()"
            [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          >
          <span class="error-text" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            Ingresa un correo válido
          </span>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="••••••••"
            (keyup.enter)="onSubmit()"
            [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          >
          <span class="error-text" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            La contraseña es obligatoria (min. 6 caracteres)
          </span>
        </div>

        <div class="error-banner" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button type="submit" class="submit-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Ingresar</span>
          <span class="spinner" *ngIf="isLoading"></span>
        </button>
      </ng-container>

      <div class="success-banner" *ngIf="successMessage">
        {{ successMessage }}
      </div>
    </form>
    
    <div class="footer-links">
      <a href="#">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</div>
